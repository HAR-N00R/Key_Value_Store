name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Show tool versions
        run: |
          cmake --version
          c++ --version

      - name: 🛠 Configure CMake
        run: cmake -S . -B build

      - name: 🔨 Build project
        run: cmake --build build

      - name: 🧪 Run tests
        run: ctest --test-dir build --output-on-failure